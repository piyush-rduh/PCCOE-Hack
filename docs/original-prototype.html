<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),KEY='agcro_db_v1';

const CROPS={Soybean:{t:'legume',se:'Kharif',w:450,y:10,c:22000,p:4600,lp:4,v:'JS-335'},Cotton:{t:'fibre',se:'Kharif',w:700,y:8,c:42000,p:6800,lp:-3,v:'Bt hybrid'},Wheat:{t:'cereal',se:'Rabi',w:450,y:18,c:24000,p:2300,lp:-1,v:'HD-2189'},'Green gram':{t:'legume',se:'Summer',w:300,y:4,c:12000,p:7500,lp:5,v:'Pusa Vishal'},Chickpea:{t:'legume',se:'Rabi',w:300,y:7,c:15000,p:5400,lp:4,v:'Digvijay'}};

fields:[{id:'fl_1',farmId:f1,name:'Plot A',area:7,soil:'Black cotton',water:'Adequate',crop:'Chickpea',lp:64,history:'Cotton 2023'},{id:'fl_2',farmId:f1,name:'Plot B',area:5,soil:'Sandy loam',water:'Limited',crop:'Chickpea',lp:55,history:'Wheat 2024'}],

crops:[{id:'cc_1',farmId:f1,crop:'Chickpea',variety:'Digvijay',planted:day(-45),area:12,harvest:day(75),stage:'Vegetative',status:'Healthy'}],
acts:[{id:'ac_1',farmId:f1,type:'Irrigation',date:day(-6),qty:40,unit:'mm',method:'Drip',notes:'Pre-flowering'},{id:'ac_2',farmId:f1,type:'Fertilizer',date:day(-30),qty:50,unit:'kg',method:'Broadcast',notes:'DAP basal'},{id:'ac_3',farmId:f1,type:'Weeding',date:day(-20),qty:2,unit:'labour-days',method:'Manual',notes:''}],
soil:[{id:'so_1',farmId:f1,test:'pH',value:7.6,date:day(-120),method:'Lab',fieldId:'fl_1'},{id:'so_2',farmId:f1,test:'Organic carbon',value:.48,date:day(-120),method:'Lab',fieldId:'fl_1'},{id:'so_3',farmId:f1,test:'EC',value:.5,date:day(-120),method:'Lab',fieldId:'fl_1'},{id:'so_4',farmId:f1,test:'Moisture',value:30,date:day(-3),method:'Probe',fieldId:'fl_1'}],
scores:[{farmId:f1,score:58,ts:day(-400)},{farmId:f1,score:61,ts:day(-200)}],dec:[],chat:[],status:{},scen:scenarios(),

const farm=()=>DB.farms.find(f=>f.id===DB.sel)||DB.farms[0],mine=k=>DB[k].filter(x=>x.farmId===farm().id);

const SC={
farms:{t:'Farm',f:[['name','Name','text'],['area','Area (acres)','number'],['soil','Soil type','select',SOILS],['water','Water source','select',['Borewell','Canal','Well','Rain-fed']],['irrig','Irrigation method','select',['Drip','Sprinkler','Flood','None']],['location','Location','text']],cols:[['Name',x=>x.name],['Area',x=>x.area+' ac'],['Soil',x=>x.soil],['Water',x=>x.water],['Irrigation',x=>x.irrig],['Location',x=>x.location]]},
fields:{t:'Zone',f:[['name','Zone name','text'],['area','Area (acres)','number'],['soil','Soil type','select',SOILS],['water','Water availability','select',yn],['crop','Current crop','select',Object.keys(CROPS)],['lp','Land Power estimate (0-100)','number'],['history','Historical info (opt)','text']],cols:[['Zone',x=>x.name],['Area',x=>x.area],['Soil',x=>x.soil],['Water',x=>x.water],['Crop',x=>x.crop],['LP',x=>x.lp]]},
seasons:{t:'Season record',f:[['crop','Crop','select',Object.keys(CROPS)],['variety','Variety (opt)','text'],['season','Season','select',['Kharif','Rabi','Summer']],['year','Year','number'],['area','Cultivated area (acres)','number'],['water','Water availability','select',yn],['fert','Fertilizer/manure (opt)','text'],['pest','Pest/disease notes (opt)','text'],['yield','Yield (quintal)','number'],['losses','Harvest losses (q) (opt)','number'],['seeds','Seeds cost ₹','number'],['fertC','Fertilizer cost ₹','number'],['pestC','Pesticide cost ₹','number'],['labour','Labour ₹','number'],['irrigC','Irrigation ₹','number'],['mach','Machinery ₹','number'],['transport','Transport ₹','number'],['other','Other ₹ (opt)','number'],['price','Selling price ₹/quintal','number']],cols:[['Crop',x=>x.crop],['Season',x=>x.season+' '+x.year],['Area',x=>x.area],['Yield (q)',x=>x.yield],['Yield/acre',x=>(x.yield/x.area).toFixed(1)],['Expenses',x=>inr(exp(x))]]},
crops:{t:'Current crop',f:[['crop','Crop','select',Object.keys(CROPS)],['variety','Variety (opt)','text'],['planted','Planting date','date'],['area','Area (acres)','number'],['harvest','Expected harvest','date'],['stage','Growth stage','select',['Sowing','Vegetative','Flowering','Grain filling','Maturity','Harvested']],['status','Crop status','select',['Healthy','Stressed','Pest pressure','Diseased']]],cols:[['Crop',x=>x.crop],['Planted',x=>x.planted],['Harvest',x=>x.harvest],['Stage',x=>x.stage],['Status',x=>x.status]]},
acts:{t:'Activity',f:[['type','Type','select',['Irrigation','Fertilizer','Pesticide','Weeding','Pest/disease observation','Other']],['date','Date','date'],['qty','Quantity','number'],['unit','Unit','select',['mm','kg','litre','labour-days','hours']],['method','Method (opt)','text'],['notes','Notes (opt)','text']],cols:[['Date',x=>x.date],['Type',x=>x.type],['Qty',x=>x.qty+' '+x.unit],['Method',x=>x.method],['Notes',x=>x.notes]]},
soil:{t:'Soil test',f:[['test','Parameter','select',Object.keys(UNIT)],['value','Value','number'],['date','Date','date'],['method','Method','select',['Lab','Probe','Field kit']],['fieldId','Zone ID (opt)','text']],cols:[['Date',x=>x.date],['Parameter',x=>x.test],['Value',x=>x.value+' '+UNIT[x.test]],['Method',x=>x.method],['Zone',x=>x.fieldId]]},
listings:{t:'Listing',f:[['crop','Crop','select',Object.keys(CROPS)],['qty','Quantity (quintal)','number'],['price','Price ₹/quintal','number'],['location','Location','text'],['harvest','Harvest date','date'],['quality','Quality description','text']],cols:[['Crop',x=>x.crop],['Qty (q)',x=>x.qty],['Price',x=>inr(x.price)+'/q'],['Location',x=>x.location],['Harvested',x=>x.harvest],['Quality',x=>x.quality]]}};
const exp=s=>['seeds','fertC','pestC','labour','irrigC','mach','transport','other'].reduce((a,k)=>a+num(s[k]),0);
const NOFARM=['farms','listings'];
function upsertForm(ent,id,defs,cb){const S=SC[ent],item=id?DB[ent].find(x=>x.id===id):null,it={...defs,...item};
mod(`<h2>${item?'Edit':'Add'} ${S.t}</h2><div id="fe" class="err"></div><div class="grid">${S.f.map(([k,l,t,o])=>`<label>${l}${t=='select'?`<select name="${k}">${o.map(x=>`<option ${it[k]==x?'selected':''}>${x}</option>`).join('')}</select>`:`<input name="${k}" type="${t}" ${t=='number'?'step="any" min="0"':''} value="${esc(it[k]??'')}">`}</label>`).join('')}</div><div class="row"><button class="btn" id="sv">Save</button><button class="btn ghost" onclick="closeM()">Cancel</button></div>`);
$('#sv').onclick=()=>{const v={};let bad='';S.f.forEach(([k,l,t])=>{const e=$('#mc [name='+k+']'),r=!/opt/.test(l);let x=e.value.trim();if(r&&x==='')bad=bad||l+' is required';if(t=='number'&&x!==''){if(isNaN(+x)||+x<0)bad=bad||l+' must be a non-negative number';x=+x}v[k]=x});

function crud(ent,intro,extra=''){const S=SC[ent],rows=NOFARM.includes(ent)?DB[ent]:mine(ent);
return `<div class="row sp"><div class="mut">${intro}</div><button class="btn" onclick="A.add('${ent}')">+ Add ${S.t.toLowerCase()}</button></div>${extra}<div class="card tw">${rows.length?`<table><tr>${S.cols.map(c=>`<th>${c[0]}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr>${S.cols.map(c=>`<td>${esc(c[1](r))}</td>`).join('')}<td><button class="btn ghost sm" onclick="A.edit('${ent}','${r.id}')">Edit</button> <button class="btn del sm" onclick="A.del('${ent}','${r.id}')">Delete</button>${ent=='farms'?` <button class="btn ghost sm" onclick="A.pick('${r.id}')">${r.id===DB.sel?'Default ✓':'Set default'}</button>`:''}</td></tr>`).join('')}</table>`:`<div class="empty">No ${S.t.toLowerCase()} records yet for this farm. Use “Add” to create the first one.</div>`}</div>`}
/* ---------- Engines: Land Power, advisory, weather, irrigation ---------- */
const latest=(fid,t)=>DB.soil.filter(s=>s.farmId===fid&&s.test===t).sort((a,b)=>a.date<b.date?1:-1)[0];
function lp(fid){const f=DB.farms.find(x=>x.id===fid),ss=DB.seasons.filter(s=>s.farmId===fid).sort((a,b)=>a.year-b.year),last=ss.at(-1);let s=60,fx=[],lim=[],miss=[];
const v=t=>latest(fid,t)?.value;
const ph=v('pH');if(ph==null)miss.push('Soil pH');else if(ph>=6&&ph<=7.8){s+=6;fx.push('Soil pH ('+ph+') is in a generally workable range')}else{s-=7;lim.push('Soil pH '+ph+' is outside 6–7.8')}
const ec=v('EC');if(ec==null)miss.push('Electrical conductivity');else if(ec>4){s-=10;lim.push('High salinity (EC '+ec+' dS/m)')}else fx.push('EC ('+ec+' dS/m) shows no salinity concern');
const oc=v('Organic carbon');if(oc==null)miss.push('Organic carbon');else if(oc>=.75){s+=8;fx.push('Organic carbon is good ('+oc+'%)')}else if(oc<.5){s-=8;lim.push('Low organic carbon ('+oc+'%)')}
['N','P','K'].forEach(t=>{if(v(t)==null)miss.push(t==='N'?'Nitrogen':t==='P'?'Phosphorus':'Potassium')});
if(last&&CROPS[last.crop]?.t==='legume'){s+=5;fx.push('Last crop ('+last.crop+') was a legume, which supports rotation benefits')}
if(ss.length>1&&ss.at(-1).crop===ss.at(-2).crop){s-=8;lim.push('Same crop grown in consecutive seasons')}
if(f.water==='Rain-fed'){s-=4;lim.push('Rain-fed: water-related risk')}if(f.irrig==='Drip'){s+=3;fx.push('Drip irrigation improves water efficiency')}
if(f.soil==='Sandy loam'){s-=3;lim.push('Sandy loam has lower water retention')}
const same=ss.filter(x=>x.crop===last?.crop);if(same.length>1){const a=same.at(-1).yield/same.at(-1).area,b=same[0].yield/same[0].area;if(a>b*1.05){s+=3;fx.push('Yield per acre rising (minor weight)')}else if(a<b*.95){s-=3;lim.push('Yield per acre falling (minor weight)')}}
const pts=(ss.length>=2)+(['pH','EC','Organic carbon','N','P','K'].filter(t=>v(t)!=null).length>=4)+(DB.fields.some(x=>x.farmId===fid))+(DB.acts.filter(a=>a.farmId===fid).length>=3)+(ph!=null);
return{score:Math.max(0,Math.min(100,Math.round(s))),fx,lim,miss,conf:['Low','Low','Medium','Medium','High','High'][pts],ss}}
const scoresOf=fid=>DB.scores.filter(s=>s.farmId===fid);
function season(){const m=new Date().getMonth();return m>=5&&m<=9?'Kharif':m>=10||m<=1?'Rabi':'Summer'}
function advise(fid){const f=DB.farms.find(x=>x.id===fid),L=lp(fid),last=lp(fid).ss.at(-1),wl=f.water==='Rain-fed'?'Limited':'Adequate',ph=latest(fid,'pH')?.value,out=Object.entries(CROPS).map(([n,d])=>{let s=50,why=[],warn=[];
if(n===last?.crop){s-=20;warn.push('Same as last crop: disease/pest carry-over risk')}else if(d.t==='legume'&&last&&CROPS[last.crop].t!=='legume'){s+=8;why.push('Legume after '+last.crop+' fits rotation')}
if(L.score<55&&d.t==='legume'){s+=8;why.push('Land Power is below 55: nitrogen-fixing crop favoured')}
if((f.water==='Rain-fed'||f.irrig==='None')&&d.w>500){s-=15;warn.push('High water need ('+d.w+' mm) for rain-fed land')}else why.push('Water need ('+d.w+' mm) matches '+f.water.toLowerCase()+' supply')
if(d.se!==season()){s-=12;warn.push('Usual season is '+d.se+'; current season is '+season())}else{s+=6;why.push('In season now ('+d.se+')')}

return `<div class="tabs row">${tabs.map(t=>`<a href="#neugen/${t}" class="${a===t?'on':''}">${t[0].toUpperCase()+t.slice(1)}</a>`).join('')}</div>`+body},
notifications(){const n=notes(farm().id);return n.length?`<div class="grid g2">${n.map(x=>card(x.t,`<div>${tag(x.c,x.k)}</div><p class="mut">${esc(x.m)}</p>`)).join('')}</div>`:'<div class="empty">No notifications. Alerts appear only from real records and rules.</div>'},
profile(){const f=DB.farmers[0];return card('Farmer profile',`<div class="grid">${[['name','Name'],['location','Location'],['phone','Phone']].map(([k,l])=>`<label>${l}<input id="p_${k}" value="${esc(f[k])}"></label>`).join('')}</div><div id="pe" class="err"></div><div class="row"><button class="btn" onclick="A.saveP()">Save profile</button></div>`)+card('Demonstration data',`<p class="mut">Everything is stored in your browser (localStorage).</p><button class="btn del" onclick="A.reset()">Reset demonstration data</button>`,'style="margin-top:14px"')}};
const NAV=[['dashboard','Dashboard','M3 11l9-8 9 8v10H3z'],['farms','My Farms','M3 20h18M5 20V9l7-5 7 5v11'],['seasons','Previous Seasons','M12 6v6l4 2M3 12a9 9 0 1018 0 9 9 0 10-18 0'],['landpower','Land Power','M3 17l6-6 4 4 8-8'],['advisory','Crop Advisory','M12 21V8M12 8c0-4 4-5 7-5 0 4-2 6-7 5zM12 12c0-3-3-4-6-4 0 3 2 5 6 4z'],['current','Current Season','M12 3v18M5 9h14'],['activities','Farm Activities','M4 6h16M4 12h16M4 18h10'],['weather','Weather & Irrigation','M12 3c4 5 6 8 6 11a6 6 0 01-12 0c0-3 2-6 6-11z'],['soil','Soil Monitoring','M4 8h16M4 14h16M7 20h10'],['zoning','Field Zoning','M3 3h8v8H3zM13 3h8v5h-8zM13 11h8v10h-8zM3 14h8v7H3z'],['profit','Profit Analysis','M4 20V10M10 20V4M16 20v-7M22 20H2'],['schemes','Government Schemes','M4 21h16M6 10v8M12 10v8M18 10v8M3 10l9-6 9 6'],['market','Marketplace','M4 7h16l-1 5H5zM6 12v8h12v-8'],['neugen','Neugen AI','M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z'],['notifications','Notifications','M6 16V11a6 6 0 1112 0v5l2 2H4zM10 21h4'],['profile','Profile & Settings','M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0']];
$('#side').innerHTML+=NAV.map(n=>`<a href="#${n[0]}" data-p="${n[0]}"><svg viewBox="0 0 24 24"><path d="${n[2]}"/></svg><span>${n[1]}</span></a>`).join('');
function render(){const[p0,a,b]=(location.hash.slice(1)||'dashboard').split('/'),p=PG[p0]?p0:'dashboard',f=farm();if(ch){ch.destroy();ch=null}HK=null;
document.querySelectorAll('#side a').forEach(x=>x.classList.toggle('on',x.dataset.p===p));$('#side').classList.remove('open');
$('#title').textContent=NAV.find(n=>n[0]===p)[1];$('#fsel').innerHTML=DB.farms.map(x=>`<option value="${x.id}" ${x.id===f.id?'selected':''}>${esc(x.name)}</option>`).join('');
const nc=notes(f.id).length;$('#bell').textContent='🔔 '+nc;$('#pf').textContent=DB.farmers[0].name.split(' ')[0];
try{$('#main').innerHTML=PG[p](a,b);if(HK)HK();const c=$('#chat');if(c)c.scrollTop=1e5}catch(e){$('#main').innerHTML=`<div class="card"><div class="err">Something went wrong rendering this page: ${esc(e.message)}</div><button class="btn" onclick="A.reset()">Reset demo data</button></div>`}}
const A={pick(id){DB.sel=id;save();sync();render()},add(e){upsertForm(e)},edit(e,id){upsertForm(e,id)},
del(e,id){mod(`<h2>Delete this record?</h2><p class="mut">This cannot be undone.</p><div class="row"><button class="btn del" id="cd">Delete</button><button class="btn ghost" onclick="closeM()">Cancel</button></div>`);$('#cd').onclick=()=>{if(e=='farms'&&DB.farms.length<2){$('#mc').innerHTML+='<div class="err">At least one farm is required.</div>';return}DB[e]=DB[e].filter(x=>x.id!==id);if(e=='farms'&&DB.sel===id)DB.sel=DB.farms[0].id;save();sync();closeM();toast('Deleted');render()}},
run(t){analyze(t);location.hash='#neugen/analysis/'+t;if(location.hash==='#neugen/analysis/'+t)render()},
dec(id,s){DB.dec.find(d=>d.id===id).status=s;save();render()},
detail(c){const x=advise(farm().id).find(r=>r.crop===c);mod(`<h2>${c} ${SIM}</h2><p>Scenario evidence: ${x.ev.join(', ')}</p><p class="mut">Evidence type: SIMULATED_DATA. Units: quintal/acre, INR/acre, mm.</p><p>${x.why.map(esc).join('. ')}</p><button class="btn ghost" onclick="closeM()">Close</button>`)},
choose(c){const d=CROPS[c];upsertForm('crops',null,{crop:c,variety:d.v,planted:day(0),area:farm().area,harvest:day(110),stage:'Sowing',status:'Healthy'},()=>{DB.status[farm().id+c]='selected'})},
reject(c){DB.status[farm().id+c]='rejected';save();toast('Recommendation rejected');render()},
harvest(id){const c=DB.crops.find(x=>x.id===id);mod(`<h2>Record harvest – ${c.crop}</h2><div id="fe" class="err"></div><div class="grid"><label>Yield (quintal)<input id="hy" type="number" min="0" step="any"></label><label>Selling price ₹/q<input id="hp" type="number" min="0" step="any" value="${CROPS[c.crop].p}"></label><label>Total expenses ₹<input id="he" type="number" min="0" step="any"></label></div><div class="row"><button class="btn" id="hs">Save harvest</button><button class="btn ghost" onclick="closeM()">Cancel</button></div>`);
$('#hs').onclick=()=>{const y=$('#hy').value,p=$('#hp').value,e=$('#he').value;if(y===''||p===''||e===''||+y<0||+p<0||+e<0){$('#fe').textContent='Enter valid non-negative yield, price and expenses';return}
c.stage='Harvested';DB.seasons.push({id:uid('se'),farmId:c.farmId,crop:c.crop,variety:c.variety,season:CROPS[c.crop].se,year:new Date().getFullYear(),area:c.area,water:'Adequate',fert:'',pest:'',yield:+y,losses:0,seeds:0,fertC:0,pestC:0,labour:0,irrigC:0,mach:0,transport:0,other:+e,price:+p});save();sync();analyze('crop');closeM();toast('Harvest saved. Land Power and recommendations updated');location.hash='#neugen/analysis/crop';render()}},
ask(q){const i=$('#cin'),t=(q||i.value).trim();if(!t){$('#cerr').textContent='Please type a question first.';return}const fid=farm().id;DB.chat.push({farmId:fid,role:'u',text:t});save();render();const c=$('#chat');c.innerHTML+='<div class="m">Neugen is thinking…</div>';c.scrollTop=1e5;
setTimeout(()=>{const r=chatReply(t);DB.chat.push({farmId:fid,role:'a',text:r||'[Simulated] I can help with irrigation, crop choice, soil, profit, weather and Land Power. Try rephrasing with one of those topics.'});save();render()},600)},
saveP(){const v={};['name','location','phone'].forEach(k=>v[k]=$('#p_'+k).value.trim());if(!v.name||!v.location){$('#pe').textContent='Name and location are required';return}Object.assign(DB.farmers[0],v);save();toast('Profile saved');render()},
reset(){mod(`<h2>Reset demonstration data?</h2><p class="mut">All your edits will be replaced by the sample data.</p><div class="row"><button class="btn del" id="rs">Reset</button><button class="btn ghost" onclick="closeM()">Cancel</button></div>`);$('#rs').onclick=()=>{seed();closeM();location.hash='#dashboard';render();toast('Demo data restored')}}};
$('#mb').onclick=e=>{if(e.target.id==='mb')closeM()};addEventListener('hashchange',render);sync();render();
</script></body></html>
